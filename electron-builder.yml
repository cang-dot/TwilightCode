appId: com.twilightcode.app
productName: TwilightCode
directories:
  output: release
files:
  - dist/**/*
  - package.json
win:
  - target:
      - nsis
      - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: TwilightCode-Portable-${version}.exe
