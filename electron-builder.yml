appId: com.twilightcode.app
productName: TwilightCode
directories:
  output: release
files:
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: TwilightCode-Portable-${version}.exe
