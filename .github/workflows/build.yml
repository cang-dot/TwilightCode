name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Electron
        uses: electron/action-setup@v4
        with:
          version: 33.4.11

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy icon for packaging
        shell: powershell
        run: Copy-Item -Path "src/renderer/assets/logo.png" -Destination "dist/renderer/assets/logo.png" -Force

      - name: Package with electron-builder
        shell: powershell
        run: npx --yes electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TwilightCode-Windows
          path: release/*.exe
          if-no-files-found: warn
